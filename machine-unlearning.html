<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Machine Unlearning — Interactive Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
/* ─── RESET & VARIABLES ─────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #f7f4ef;
  --surface:   #ffffff;
  --surface2:  #f2ede6;
  --border:    #ddd8cf;
  --border2:   #ece7df;
  --text:      #1c1917;
  --text2:     #6b6560;
  --text3:     #a09a94;
  --amber:     #b45309;
  --amber-bg:  #fef3c7;
  --amber-bd:  #fcd34d;
  --red:       #b91c1c;
  --red-bg:    #fee2e2;
  --red-bd:    #fca5a5;
  --green:     #15803d;
  --green-bg:  #dcfce7;
  --green-bd:  #86efac;
  --blue:      #0369a1;
  --blue-bg:   #e0f2fe;
  --blue-bd:   #7dd3fc;
  --purple:    #6d28d9;
  --purple-bg: #ede9fe;
  --purple-bd: #c4b5fd;

  --c-a:  #0891b2;
  --c-b:  #7c3aed;
  --c-agg:#b45309;

  --radius: 6px;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
  --shadow-md: 0 4px 12px rgba(0,0,0,.08);

  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 14px;
  color: var(--text);
  background: var(--bg);
}

/* ─── LAYOUT ─────────────────────────────────────────────── */
body { min-height: 100vh; display: flex; flex-direction: column; }

header {
  background: var(--surface);
  border-bottom: 1.5px solid var(--border);
  padding: 14px 28px;
  display: flex; align-items: baseline; gap: 14px;
  position: sticky; top: 0; z-index: 10;
  box-shadow: var(--shadow);
}
header h1 {
  font-family: 'DM Serif Display', serif;
  font-size: 22px; font-weight: 400;
  color: var(--text); letter-spacing: -.3px;
}
header span {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px; letter-spacing: 3px;
  color: var(--text3); text-transform: uppercase;
}

/* ─── TABS ───────────────────────────────────────────────── */
.tab-bar {
  display: flex; background: var(--surface);
  border-bottom: 1.5px solid var(--border);
  overflow-x: auto; flex-shrink: 0;
}
.tab-bar::-webkit-scrollbar { height: 0; }

.tab {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px; letter-spacing: .3px;
  padding: 11px 18px; border: none;
  border-bottom: 2.5px solid transparent;
  background: transparent; cursor: pointer;
  color: var(--text3); white-space: nowrap;
  flex: 1; transition: color .15s, border-color .15s, background .15s;
}
.tab:hover { color: var(--text2); background: var(--surface2); }
.tab.active { color: var(--tab-c, var(--text)); border-bottom-color: var(--tab-c, var(--text)); background: var(--surface2); font-weight: 500; }

.subtab-bar {
  display: flex; background: var(--surface2);
  border-bottom: 1.5px solid var(--border);
  overflow-x: auto; flex-shrink: 0;
}
.subtab {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9.5px; padding: 8px 14px;
  border: none; border-bottom: 2px solid transparent;
  background: transparent; cursor: pointer;
  color: var(--text3); white-space: nowrap;
  flex: 1; transition: all .15s;
}
.subtab:hover { color: var(--text2); }
.subtab.active { color: var(--tab-c, var(--text)); border-bottom-color: var(--tab-c, var(--text)); font-weight: 500; }

/* ─── MAIN SPLIT ─────────────────────────────────────────── */
.main {
  display: flex; flex: 1;
  flex-wrap: wrap; overflow: auto;
}

.left-panel {
  flex: 0 0 460px;
  padding: 20px 22px;
  border-right: 1.5px solid var(--border);
}
.right-panel {
  flex: 1; min-width: 300px;
  padding: 20px 22px;
  display: flex; flex-direction: column; gap: 14px;
  overflow: auto;
}

.panel-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px; letter-spacing: 3px;
  color: var(--text3); text-transform: uppercase;
  margin-bottom: 10px;
}

/* ─── CARDS ──────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: var(--shadow);
}

.info-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  border-left-width: 3.5px;
  padding: 14px 16px;
  box-shadow: var(--shadow);
}
.info-card h2 {
  font-family: 'DM Serif Display', serif;
  font-size: 15px; font-weight: 400;
  margin-bottom: 9px;
}
.info-card p {
  font-size: 12px; line-height: 1.8;
  color: var(--text2); white-space: pre-line;
}
.callout {
  margin-top: 11px; padding: 8px 11px;
  border-radius: 4px;
  font-size: 11.5px; line-height: 1.65;
}

/* ─── WEIGHT DISPLAY ─────────────────────────────────────── */
.weight-box {
  display: flex; gap: 20px; font-family: 'IBM Plex Mono', monospace;
  font-size: 13px; margin-top: 12px;
}
.weight-box span { color: var(--text2); }
.weight-box b { font-weight: 500; }

/* ─── COMPARE TABLE ─────────────────────────────────────── */
.cmp-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.cmp-table td { padding: 5px 8px; border-bottom: 1px solid var(--border2); font-family: 'IBM Plex Mono', monospace; }
.cmp-table td:last-child { text-align: right; }

/* ─── CONTROLS BAR ───────────────────────────────────────── */
.controls {
  border-top: 1.5px solid var(--border);
  background: var(--surface);
  padding: 10px 22px;
  display: flex; align-items: center; gap: 8px;
  flex-wrap: wrap; flex-shrink: 0;
  box-shadow: 0 -1px 4px rgba(0,0,0,.05);
}
.btn {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px; padding: 6px 14px;
  border: 1.5px solid var(--border);
  background: var(--surface); color: var(--text2);
  border-radius: var(--radius); cursor: pointer;
  transition: all .15s;
}
.btn:hover { background: var(--surface2); border-color: var(--border); color: var(--text); }
.btn.primary { border-color: var(--amber); color: var(--amber); }
.btn.primary:hover { background: var(--amber-bg); }

.range-wrap { display: flex; align-items: center; gap: 7px; flex: 1; min-width: 80px; }
.range-label { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 2px; color: var(--text3); white-space: nowrap; }
input[type=range] { flex: 1; accent-color: var(--amber); cursor: pointer; }
.step-counter { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text3); min-width: 52px; }

/* ─── LEGEND ─────────────────────────────────────────────── */
.legend { display: flex; gap: 14px; margin-top: 8px; flex-wrap: wrap; }
.legend-item { font-size: 10.5px; color: var(--text3); display: flex; align-items: center; gap: 4px; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.legend-dash { width: 16px; height: 2px; display: inline-block; }

/* ─── PLOT SVG ───────────────────────────────────────────── */
svg { overflow: visible; }

/* ─── SISA COST BAR ──────────────────────────────────────── */
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.bar-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text2); min-width: 90px; }
.bar-track { flex: 1; background: var(--surface2); border-radius: 3px; height: 20px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; display: flex; align-items: center; padding-left: 8px;
  font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #fff; font-weight: 500;
  transition: width .6s cubic-bezier(.4,0,.2,1); }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <h1>Machine Unlearning</h1>
  <span>Interactive Demo</span>
</header>

<!-- PHASE TABS -->
<div class="tab-bar" id="phaseTabs"></div>

<!-- SISA SUB-TABS (hidden unless phase 4) -->
<div class="subtab-bar" id="sisaTabs" style="display:none"></div>

<!-- MAIN -->
<div class="main">
  <!-- LEFT: PLOT -->
  <div class="left-panel">
    <div class="panel-label">Regression Plot</div>
    <svg id="mainPlot" width="100%" viewBox="0 0 430 280"></svg>
    <div class="legend" id="plotLegend"></div>
    <!-- weight box -->
    <div id="weightBox" style="display:none" class="card" style="margin-top:12px">
      <div class="panel-label" style="margin-bottom:6px">Weights</div>
      <div class="weight-box" id="weightVals"></div>
      <div style="margin-top:4px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text3)" id="epochLabel"></div>
    </div>
    <!-- compare table (shown at end of specific phases) -->
    <div id="cmpBox" class="card" style="display:none;margin-top:12px">
      <div class="panel-label" style="margin-bottom:8px">Final Weight Comparison</div>
      <table class="cmp-table" id="cmpTable"></table>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel" id="rightPanel"></div>
</div>

<!-- CONTROLS -->
<div class="controls" id="controls" style="display:none">
  <button class="btn primary" id="btnPlay">▶ Play</button>
  <button class="btn" id="btnReset">⟳</button>
  <button class="btn" id="btnPrev">‹</button>
  <button class="btn" id="btnNext">›</button>
  <div class="range-wrap">
    <span class="range-label">STEP</span>
    <input type="range" id="stepSlider" min="0" value="0"/>
    <span class="step-counter" id="stepCounter">0 / 0</span>
  </div>
  <div class="range-wrap" style="flex:0 0 160px">
    <span class="range-label">SPEED</span>
    <input type="range" id="speedSlider" min="1" max="15" value="4" style="flex:1"/>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  DATA
// ═══════════════════════════════════════════════════════════
const ALL_DATA = [
  {x:0.5, y:2.1,  id:0, shard:"A"},
  {x:1.0, y:3.2,  id:1, shard:"A"},
  {x:1.5, y:4.0,  id:2, shard:"A"},
  {x:2.0, y:-2.5, id:3, shard:"A", poisoned:true},
  {x:2.5, y:6.1,  id:4, shard:"B"},
  {x:3.0, y:7.0,  id:5, shard:"B"},
  {x:3.5, y:8.1,  id:6, shard:"B"},
  {x:4.0, y:-1.0, id:7, shard:"A", poisoned:true},
  {x:4.5, y:10.2, id:8, shard:"B"},
  {x:5.0, y:11.1, id:9, shard:"B"},
];
const GOOD_DATA    = ALL_DATA.filter(p=>!p.poisoned);
const BAD_DATA     = ALL_DATA.filter(p=> p.poisoned);
const SHARD_A_ALL  = ALL_DATA.filter(p=>p.shard==="A");
const SHARD_B_ALL  = ALL_DATA.filter(p=>p.shard==="B");
const SHARD_A_CLEAN = SHARD_A_ALL.filter(p=>!p.poisoned);

// ═══════════════════════════════════════════════════════════
//  MATH
// ═══════════════════════════════════════════════════════════
const mse = (pts,w,b) => pts.reduce((s,p)=>s+(w*p.x+b-p.y)**2,0)/pts.length;
const grad = (pts,w,b) => {
  let dw=0,db=0;
  pts.forEach(({x,y})=>{const e=w*x+b-y; dw+=e*x; db+=e;});
  return {dw:dw/pts.length, db:db/pts.length};
};

function buildHistory(w0,b0,pts,lr,steps,ascent=false){
  let w=w0,b=b0;
  const h=[{step:0,w,b,lG:mse(GOOD_DATA,w,b),lB:mse(BAD_DATA,w,b)}];
  for(let i=1;i<=steps;i++){
    const {dw,db}=grad(pts,w,b);
    w=ascent?w+lr*dw:w-lr*dw; b=ascent?b+lr*db:b-lr*db;
    h.push({step:i,w,b,lG:mse(GOOD_DATA,w,b),lB:mse(BAD_DATA,w,b)});
  }
  return h;
}
function buildDualHistory(pA,pB,lr,steps){
  let wa=0,ba=0,wb=0,bb=0;
  const h=[{step:0,wa,ba,wb,bb,lA:mse(pA,wa,ba),lB:mse(pB,wb,bb)}];
  for(let i=1;i<=steps;i++){
    const ga=grad(pA,wa,ba); wa-=lr*ga.dw; ba-=lr*ga.db;
    const gb=grad(pB,wb,bb); wb-=lr*gb.dw; bb-=lr*gb.db;
    h.push({step:i,wa,ba,wb,bb,lA:mse(pA,wa,ba),lB:mse(pB,wb,bb)});
  }
  return h;
}
function buildShardARetrain(wBf,bBf,pA,lr,steps){
  let wa=0,ba=0;
  const bLoss=mse(SHARD_B_ALL,wBf,bBf);
  const h=[{step:0,wa,ba,wb:wBf,bb:bBf,lA:mse(pA,wa,ba),lB:bLoss}];
  for(let i=1;i<=steps;i++){
    const g=grad(pA,wa,ba); wa-=lr*g.dw; ba-=lr*g.db;
    h.push({step:i,wa,ba,wb:wBf,bb:bBf,lA:mse(pA,wa,ba),lB:bLoss});
  }
  return h;
}

// ═══════════════════════════════════════════════════════════
//  PRECOMPUTE
// ═══════════════════════════════════════════════════════════
const H_TRAIN   = buildHistory(0,0,ALL_DATA,0.05,250);
const H_UNLEARN = buildHistory(H_TRAIN.at(-1).w, H_TRAIN.at(-1).b, BAD_DATA, 0.001, 80, true);
const H_RETRAIN = buildHistory(0,0,GOOD_DATA,0.05,250);
const H_SDIRTY  = buildDualHistory(SHARD_A_ALL,SHARD_B_ALL,0.05,250);
const H_SRETRAIN= buildShardARetrain(H_SDIRTY.at(-1).wb, H_SDIRTY.at(-1).bb, SHARD_A_CLEAN, 0.05, 250);

const wAgg = (H_SRETRAIN.at(-1).wa + H_SDIRTY.at(-1).wb) / 2;
const bAgg = (H_SRETRAIN.at(-1).ba + H_SDIRTY.at(-1).bb) / 2;

// ═══════════════════════════════════════════════════════════
//  PHASE / SISA CONFIG
// ═══════════════════════════════════════════════════════════
const PHASES = [
  {id:0, label:"01 · Data Overview",       color:"#b45309", colorVar:"var(--amber)"},
  {id:1, label:"02 · Corrupted Training",  color:"#6d28d9", colorVar:"var(--purple)"},
  {id:2, label:"03 · Naive Unlearning",    color:"#b91c1c", colorVar:"var(--red)"},
  {id:3, label:"04 · Gold Standard",       color:"#15803d", colorVar:"var(--green)"},
  {id:4, label:"05 · SISA Unlearning",     color:"#0369a1", colorVar:"var(--blue)"},
];
const SISA_SUBS = [
  {id:0, label:"① Shard Split",    color:"#0369a1"},
  {id:1, label:"② Dirty Train",    color:"#6d28d9"},
  {id:2, label:"③ Unlearn Req",    color:"#b45309"},
  {id:3, label:"④ Shard Retrain",  color:"#15803d"},
  {id:4, label:"⑤ Aggregate",      color:"#b45309"},
];

// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════
const STATE = {phase:0, sisaSub:0, step:0, playing:false, speed:4};
let rafId = null;

function getHistory(){
  if(STATE.phase===4){
    if(STATE.sisaSub===1) return H_SDIRTY;
    if(STATE.sisaSub===3) return H_SRETRAIN;
    return null;
  }
  return [null, H_TRAIN, H_UNLEARN, H_RETRAIN, null][STATE.phase];
}

// ═══════════════════════════════════════════════════════════
//  SVG PLOT HELPERS
// ═══════════════════════════════════════════════════════════
const PL=52,PR=18,PT=16,PB=40,PW=430,PH=280;
const XMN=0,XMX=5.5,YMN=-6,YMX=14;
const px=x=>PL+(x-XMN)/(XMX-XMN)*(PW-PL-PR);
const py=y=>PH-PB-(y-YMN)/(YMX-YMN)*(PH-PT-PB);

function svgEl(tag,attrs){
  const el=document.createElementNS("http://www.w3.org/2000/svg",tag);
  for(const [k,v] of Object.entries(attrs)) el.setAttribute(k,v);
  return el;
}

function buildPlotBase(svg){
  svg.innerHTML="";
  // defs / clipPath
  const defs=svgEl("defs",{});
  const cp=svgEl("clipPath",{id:"pc"});
  cp.appendChild(svgEl("rect",{x:PL,y:PT,width:PW-PL-PR,height:PH-PT-PB}));
  defs.appendChild(cp); svg.appendChild(defs);
  // grid
  const gridG=svgEl("g",{class:"grid"});
  for(let x=0;x<=5;x++) gridG.appendChild(svgEl("line",{x1:px(x),y1:PT,x2:px(x),y2:PH-PB,stroke:"#ebe6dd","stroke-width":1}));
  for(let y=-4;y<=12;y+=2) gridG.appendChild(svgEl("line",{x1:PL,y1:py(y),x2:PW-PR,y2:py(y),stroke:"#ebe6dd","stroke-width":1}));
  svg.appendChild(gridG);
  // axes
  svg.appendChild(svgEl("line",{x1:PL,y1:PH-PB,x2:PW-PR,y2:PH-PB,stroke:"#c8c0b4","stroke-width":1.5}));
  svg.appendChild(svgEl("line",{x1:PL,y1:PT,    x2:PL,   y2:PH-PB,stroke:"#c8c0b4","stroke-width":1.5}));
  // tick labels
  const tickG=svgEl("g",{"font-family":"IBM Plex Mono","font-size":"9","fill":"#a09a94"});
  for(let x=0;x<=5;x++){const t=svgEl("text",{x:px(x),y:PH-PB+14,"text-anchor":"middle"}); t.textContent=x; tickG.appendChild(t);}
  for(const y of [-4,0,4,8,12]){const t=svgEl("text",{x:PL-6,y:py(y)+3,"text-anchor":"end"}); t.textContent=y; tickG.appendChild(t);}
  svg.appendChild(tickG);
  // axis labels
  const xl=svgEl("text",{x:PW/2,y:PH-1,"text-anchor":"middle","font-family":"IBM Plex Mono","font-size":"9","fill":"#a09a94"}); xl.textContent="x"; svg.appendChild(xl);
  const yl=svgEl("text",{x:8,y:PH/2,"text-anchor":"middle","font-family":"IBM Plex Mono","font-size":"9","fill":"#a09a94",transform:`rotate(-90,8,${PH/2})`}); yl.textContent="y"; svg.appendChild(yl);
  // true model reference
  const tr=svgEl("line",{x1:px(0),y1:py(1),x2:px(5.5),y2:py(12),stroke:"#aaa5","stroke-width":1,"stroke-dasharray":"3,7","clip-path":"url(#pc)"});
  svg.appendChild(tr);
  // data points group (drawn last so on top)
  const ptG=svgEl("g",{id:"ptGroup"}); svg.appendChild(ptG);
  // lines group (below points)
  const lnG=svgEl("g",{id:"lnGroup"}); svg.insertBefore(lnG, ptG);
  return {ptG, lnG};
}

function drawPoints(ptG, opts={}){
  ptG.innerHTML="";
  ALL_DATA.forEach(p=>{
    const cx=px(p.x), cy=py(p.y);
    const shardFill = p.shard==="A" ? "#0891b2" : "#7c3aed";
    const fill  = opts.shardColors ? shardFill : "#16a34a";
    const stroke= opts.shardColors ? shardFill : "#22c55e";
    if(p.poisoned){
      // glow
      ptG.appendChild(svgEl("circle",{cx,cy,r:12,fill:"rgba(220,38,38,.08)"}));
      ptG.appendChild(svgEl("circle",{cx,cy,r:7,fill:"#ef4444",stroke:"#fca5a5","stroke-width":1.5}));
      const mk=svgEl("g",{});
      [[cx-4,cy-4,cx+4,cy+4],[cx+4,cy-4,cx-4,cy+4]].forEach(([x1,y1,x2,y2])=>
        mk.appendChild(svgEl("line",{x1,y1,x2,y2,stroke:"#fff","stroke-width":2,"stroke-linecap":"round"})));
      ptG.appendChild(mk);
      if(opts.shardColors){
        ptG.appendChild(svgEl("circle",{cx,cy,r:11,fill:"none",stroke:shardFill,"stroke-width":1.5,opacity:.55}));
      }
    } else {
      ptG.appendChild(svgEl("circle",{cx,cy,r:6,fill,stroke,opacity:.9,"stroke-width":1}));
    }
  });
}

function drawRegLine(lnG, w, b, color, opts={}){
  const y1=w*0+b, y2=w*5.5+b;
  const glow=svgEl("line",{x1:px(0),y1:py(y1),x2:px(5.5),y2:py(y2),stroke:color,"stroke-width":opts.width?opts.width+4:6,opacity:.13,"clip-path":"url(#pc)"});
  const line=svgEl("line",{x1:px(0),y1:py(y1),x2:px(5.5),y2:py(y2),stroke:color,"stroke-width":opts.width||2.2,opacity:opts.opacity||1,"clip-path":"url(#pc)"});
  if(opts.dash) line.setAttribute("stroke-dasharray",opts.dash);
  lnG.appendChild(glow); lnG.appendChild(line);
}

// ═══════════════════════════════════════════════════════════
//  LOSS CHART
// ═══════════════════════════════════════════════════════════
function buildLossChart(id, labels){
  const d=document.getElementById(id); if(!d) return;
  d.innerHTML="";
  const W=d.parentElement.clientWidth||380, H=130;
  const svg=svgEl("svg",{width:"100%",viewBox:`0 0 ${W} ${H}`,"style":"overflow:visible"});
  d.appendChild(svg);
  // store dims for later
  d._W=W; d._H=H;
  // axes
  const axisg=svgEl("g",{});
  axisg.appendChild(svgEl("line",{x1:44,y1:H-26,x2:W-10,y2:H-26,stroke:"#c8c0b4","stroke-width":1}));
  axisg.appendChild(svgEl("line",{x1:44,y1:8,    x2:44,   y2:H-26,stroke:"#c8c0b4","stroke-width":1}));
  svg.appendChild(axisg);
  // line paths (will be updated)
  const paths={};
  for(const [key,color] of Object.entries(labels)){
    const p=svgEl("path",{fill:"none",stroke:color,"stroke-width":2,"stroke-linejoin":"round"});
    svg.appendChild(p); paths[key]=p;
  }
  // tick groups (updated on render)
  const xTicks=svgEl("g",{"font-family":"IBM Plex Mono","font-size":"8","fill":"#a09a94"});
  const yTicks=svgEl("g",{"font-family":"IBM Plex Mono","font-size":"8","fill":"#a09a94"});
  svg.appendChild(xTicks); svg.appendChild(yTicks);
  d._paths=paths; d._xTicks=xTicks; d._yTicks=yTicks; d._svg=svg;
}

function updateLossChart(id, history, step){
  const d=document.getElementById(id); if(!d||!d._paths) return;
  const W=d._W||380, H=d._H||130;
  const L=44,R=10,T=8,B=26;
  const visible=history.slice(0,step+1);
  const allVals=visible.flatMap(h=>Object.values(d._paths).map((_,i)=>h[Object.keys(d._paths)[i]]||0));
  let yMax=Math.max(...allVals,0.1); yMax=Math.ceil(yMax/10)*10||10;
  const cx=s=>L+(s/(history.length-1||1))*(W-L-R);
  const cy=v=>H-B-(v/yMax)*(H-T-B);

  for(const [key,path] of Object.entries(d._paths)){
    let d2=""; visible.forEach((h,i)=>{ const v=h[key]||0; d2+=(i===0?"M":"L")+cx(h.step).toFixed(1)+","+cy(v).toFixed(1); });
    path.setAttribute("d",d2);
  }
  // y ticks
  d._yTicks.innerHTML="";
  for(let v=0;v<=yMax;v+=yMax/4){
    const t=svgEl("text",{x:40,y:cy(v)+3,"text-anchor":"end"});
    t.textContent=v>999?`${(v/1000).toFixed(1)}k`:v.toFixed(0); d._yTicks.appendChild(t);
    d._yTicks.appendChild(svgEl("line",{x1:44,y1:cy(v),x2:W-R,y2:cy(v),stroke:"#ebe6dd","stroke-width":1}));
  }
  // x ticks (just endpoints)
  d._xTicks.innerHTML="";
  [[0,0],[Math.floor((history.length-1)/2),null],[history.length-1,null]].forEach(([s])=>{
    const t=svgEl("text",{x:cx(s),y:H-B+11,"text-anchor":"middle"}); t.textContent=s; d._xTicks.appendChild(t);
  });
}

const PHASE_INFO = [

    noteType:"info" },
  { title:"Corrupted Training",
    color:"var(--purple)", borderColor:"#6d28d9",
    desc:`We train a single linear neuron  ŷ = w·x + b  with gradient descent on all 10 points, minimising the mean squared error (MSE) loss.\n\nThe model converges — but the 2 poisoned points drag the weights away from the true parameters (w≈2, b≈1).`,

const SISA_INFO = [

    note:`Key insight: unlearning a point only requires retraining the shard that contains it. If both bad points are in Shard A, only Shard A needs to retrain.`,

    color:"var(--purple)", borderColor:"#6d28d9",

function render(){
  const {phase, sisaSub, step} = STATE;
  const history = getHistory();
  const maxStep = history ? history.length-1 : 0;
  const st = history ? history[Math.min(step, maxStep)] : null;
  const dF = H_SDIRTY.at(-1), rF = H_SRETRAIN.at(-1);
  const tF = H_TRAIN.at(-1);

  // ── Controls visibility ──
  const ctrl = document.getElementById("controls");
  ctrl.style.display = history ? "flex" : "none";
  if(history){
    document.getElementById("stepSlider").max = maxStep;
    document.getElementById("stepSlider").value = step;
    document.getElementById("stepCounter").textContent = `${st?.step??0} / ${maxStep}`;
    document.getElementById("btnPlay").textContent = STATE.playing ? "⏸ Pause" : "▶ Play";
  }

  // ── Plot ──
  const svg = document.getElementById("mainPlot");
  const {ptG, lnG} = buildPlotBase(svg);
  drawPoints(ptG, {shardColors: phase===4});

  if(phase < 4){
    if(phase >= 2) drawRegLine(lnG, tF.w, tF.b, "#6d28d9", {opacity:.35, dash:"5,4", width:1.5});
    if(phase > 0 && st) drawRegLine(lnG, st.w, st.b, PHASES[phase].color, {width:2.2});
  } else {
    const s=sisaSub;
    if(s===1&&st){ drawRegLine(lnG,st.wa,st.ba,"#0891b2",{width:2}); drawRegLine(lnG,st.wb,st.bb,"#7c3aed",{width:2}); }
    if(s===2){ drawRegLine(lnG,dF.wa,dF.ba,"#0891b2",{opacity:.5,dash:"5,4",width:1.8}); drawRegLine(lnG,dF.wb,dF.bb,"#7c3aed",{opacity:.5,dash:"5,4",width:1.8});
      BAD_DATA.forEach(p=>{ lnG.appendChild(svgEl("circle",{cx:px(p.x),cy:py(p.y),r:20,fill:"none",stroke:"#b45309","stroke-width":1.5,"stroke-dasharray":"3,3",opacity:.7,"clip-path":"url(#pc)"})); }); }
    if(s===3){ drawRegLine(lnG,dF.wb,dF.bb,"#7c3aed",{opacity:.35,dash:"4,4",width:1.5}); if(st) drawRegLine(lnG,st.wa,st.ba,"#0891b2",{width:2.2}); }
    if(s===4){ drawRegLine(lnG,rF.wa,rF.ba,"#0891b2",{opacity:.4,dash:"3,5",width:1.5}); drawRegLine(lnG,dF.wb,dF.bb,"#7c3aed",{opacity:.4,dash:"3,5",width:1.5}); drawRegLine(lnG,wAgg,bAgg,"#b45309",{width:2.5}); }
  }

  // ── Legend ──
  const leg = document.getElementById("plotLegend");
  const dot=(c,txt)=>`<span class="legend-item"><span class="legend-dot" style="background:${c}"></span>${txt}</span>`;
  const dash=(c,txt)=>`<span class="legend-item"><span class="legend-dash" style="background:${c};opacity:.6"></span>${txt}</span>`;
  let legHTML = dot("#16a34a","Clean (8)") + dot("#ef4444","Poisoned (2)");
  if(phase>0&&phase<4) legHTML+=dash("#999","y=2x+1 (true)");
  if(phase>=2&&phase<4) legHTML+=`<span class="legend-item"><span class="legend-dash" style="background:#6d28d9;opacity:.5"></span>Corrupted model</span>`;
  if(phase===4){ legHTML=dot("#0891b2","Shard A")+dot("#7c3aed","Shard B")+dot("#ef4444","Poisoned"); if(sisaSub===4) legHTML+=`<span class="legend-item"><span class="legend-dash" style="background:#b45309"></span>SISA aggregated</span>`; }
  leg.innerHTML=legHTML;

  // ── Weight box ──
  const wb=document.getElementById("weightBox"); wb.style.display="none";
  const wv=document.getElementById("weightVals"), ep=document.getElementById("epochLabel");
  if(st && phase<4){
    wb.style.display="block";
    wv.innerHTML=`<span>w = <b style="color:${PHASES[phase].color}">${st.w.toFixed(4)}</b></span><span>b = <b style="color:${PHASES[phase].color}">${st.b.toFixed(4)}</b></span>`;
    ep.textContent=`epoch ${st.step} / ${maxStep}`;
  }
  if(phase===4&&sisaSub===1&&st){ wb.style.display="block"; wv.innerHTML=`<span style="color:#0891b2">A: w=${st.wa.toFixed(3)}  b=${st.ba.toFixed(3)}</span><span style="color:#7c3aed">B: w=${st.wb.toFixed(3)}  b=${st.bb.toFixed(3)}</span>`; ep.textContent=`epoch ${st.step}`; }
  if(phase===4&&sisaSub===3&&st){ wb.style.display="block"; wv.innerHTML=`<span style="color:#15803d">A: w=${st.wa.toFixed(3)}  b=${st.ba.toFixed(3)}</span><span style="color:#7c3aed;opacity:.5">B: w=${dF.wb.toFixed(3)}  b=${dF.bb.toFixed(3)} (frozen)</span>`; ep.textContent=`epoch ${st.step}`; }

  // ── Compare table ──
  const cb=document.getElementById("cmpBox"); cb.style.display="none";
  const showCmp=(phase===3&&step>=maxStep)||(phase===4&&sisaSub===4);
  if(showCmp){
    cb.style.display="block";
    const rows=[
      {label:"True model",      w:2.000, b:1.000, c:"#1c1917"},
      {label:"Corrupted train", w:tF.w,  b:tF.b,  c:"#6d28d9"},
      {label:"Naive unlearn",   w:H_UNLEARN.at(-1).w, b:H_UNLEARN.at(-1).b, c:"#b91c1c"},
      {label:"Full retrain",    w:H_RETRAIN.at(-1).w, b:H_RETRAIN.at(-1).b, c:"#15803d"},
      {label:"SISA aggregate",  w:wAgg, b:bAgg, c:"#b45309"},
    ];
    document.getElementById("cmpTable").innerHTML=rows.map(r=>`<tr><td style="color:${r.c}">${r.label}</td><td style="color:${r.c}">w=${r.w.toFixed(3)}&nbsp;&nbsp;b=${r.b.toFixed(3)}</td></tr>`).join("");
  }

  // ── Right panel ──
  renderRight(phase, sisaSub, step, maxStep, st, dF, rF, history);
}

            <span class="legend-item"><span class="legend-dot" style="background:#ef4444"></span>Poisoned data loss</span>
          </div>
          <div id="lossAlert" style="margin-top:6px"></div>
        </div>`;
    }

    // Build and update chart
    setTimeout(()=>{
      if(!history) return;
      buildLossChart("lossChart",{lG:"#16a34a",lB:"#ef4444"});
      updateLossChart("lossChart", history, step);
      // alert
      const al=document.getElementById("lossAlert"); if(!al) return;
      const nt2=phase===2&&step>8 ? {bg:"var(--red-bg)",bd:"var(--red-bd)",c:"var(--red)",msg:"⚠ Clean data loss rising — catastrophic forgetting!"}
        :phase===3&&step>60 ? {bg:"var(--green-bg)",bd:"var(--green-bd)",c:"var(--green)",msg:"✓ Converges cleanly — no forgetting, no instability."}
        :phase===1&&step>60 ? {bg:"var(--amber-bg)",bd:"var(--amber-bd)",c:"var(--amber)",msg:"Loss converges, but biased weights reflect poisoned data."}
        :null;
      if(nt2) al.innerHTML=`<div style="padding:6px 10px;background:${nt2.bg};border:1px solid ${nt2.bd};border-radius:4px;font-size:11px;color:${nt2.c};line-height:1.6">${nt2.msg}</div>`;
    },0);

  } else {
    // SISA phase
    const info = SISA_INFO[sub];
    const nt = NOTETYPE[info.noteType];
    panel.innerHTML += `
      <div class="info-card" style="border-color:${info.borderColor}">
        <h2 style="color:${info.borderColor}">${info.title}</h2>
        <p>${info.desc}</p>
        <div class="callout" style="background:${nt.bg};border:1px solid ${nt.border};color:${nt.text}">${info.note}</div>
      </div>`;

    // SISA arch
    panel.innerHTML += `
      <div class="card">
        <div class="panel-label">SISA Architecture</div>
        ${sisaArchSVG(sub, st, dF, rF)}
      </div>`;

    // Sub-specific charts
    if(sub===1){
      panel.innerHTML+=`<div class="card" style="flex:1"><div class="panel-label">Shard Training Loss</div><div id="lossChart"></div><div class="legend" style="margin-top:8px"><span class="legend-item"><span class="legend-dot" style="background:#0891b2"></span>Shard A (biased)</span><span class="legend-item"><span class="legend-dot" style="background:#7c3aed"></span>Shard B (clean)</span></div><div id="lossAlert"></div></div>`;
      setTimeout(()=>{
        buildLossChart("lossChart",{lA:"#0891b2",lB:"#7c3aed"});
        updateLossChart("lossChart",H_SDIRTY,step);
        if(step>60) document.getElementById("lossAlert").innerHTML=`<div style="padding:6px 10px;background:var(--amber-bg);border:1px solid var(--amber-bd);border-radius:4px;font-size:11px;color:var(--amber);line-height:1.6">Both converged, but Shard A's parameters remain biased by its poisoned points.</div>`;
      },0);
    }
    if(sub===3){
      panel.innerHTML+=`<div class="card" style="flex:1"><div class="panel-label">Shard A Retrain Loss</div><div id="lossChart"></div><div class="legend" style="margin-top:8px"><span class="legend-item"><span class="legend-dot" style="background:#16a34a"></span>Shard A retraining</span><span class="legend-item"><span class="legend-dash" style="background:#7c3aed;opacity:.5"></span>Shard B frozen</span></div><div id="lossAlert"></div></div>`;
      setTimeout(()=>{
        buildLossChart("lossChart",{lA:"#16a34a",lB:"#7c3aed"});
        updateLossChart("lossChart",H_SRETRAIN,step);
        if(step>80) document.getElementById("lossAlert").innerHTML=`<div style="padding:6px 10px;background:var(--green-bg);border:1px solid var(--green-bd);border-radius:4px;font-size:11px;color:var(--green);line-height:1.6">✓ Shard A converges cleanly. Shard B was never touched.</div>`;
      },0);
    }
    if(sub===4){
      panel.innerHTML+=`<div class="card"><div class="panel-label">Computational Cost — Gradient Steps to Unlearn</div>${costBarHTML()}</div>`;
    }
  }
}

// ═══════════════════════════════════════════════════════════
//  ANIMATION LOOP
// ═══════════════════════════════════════════════════════════
let lastTick=0;
function tick(ts){
  if(!STATE.playing){ rafId=null; return; }
  if(ts-lastTick>50){
    lastTick=ts;
    const history=getHistory();
    const max=history?history.length-1:0;
    if(STATE.step>=max){ STATE.playing=false; render(); rafId=null; return; }
    STATE.step=Math.min(STATE.step+STATE.speed, max);
    render();
  }
  rafId=requestAnimationFrame(tick);
}
function startPlay(){ if(!STATE.playing){ STATE.playing=true; rafId=requestAnimationFrame(tick); } }
function stopPlay(){ STATE.playing=false; if(rafId){cancelAnimationFrame(rafId); rafId=null;} }

// ═══════════════════════════════════════════════════════════
//  TABS INIT
// ═══════════════════════════════════════════════════════════
function buildTabs(){
  const bar=document.getElementById("phaseTabs");
  PHASES.forEach(p=>{
    const btn=document.createElement("button");
    btn.className="tab"; btn.textContent=p.label;
    btn.style.setProperty("--tab-c", p.color);
    if(p.id===STATE.phase) btn.classList.add("active");
    btn.onclick=()=>{ stopPlay(); STATE.phase=p.id; STATE.step=0; STATE.sisaSub=0; updateTabs(); updateSisaTabs(); render(); };
    bar.appendChild(btn);
  });

  const sbar=document.getElementById("sisaTabs");
  SISA_SUBS.forEach(s=>{
    const btn=document.createElement("button");
    btn.className="subtab"; btn.textContent=s.label;
    btn.style.setProperty("--tab-c", s.color);
    if(s.id===STATE.sisaSub) btn.classList.add("active");
    btn.onclick=()=>{ stopPlay(); STATE.sisaSub=s.id; STATE.step=0; updateSisaTabs(); render(); };
    sbar.appendChild(btn);
  });
}

function updateTabs(){
  document.querySelectorAll("#phaseTabs .tab").forEach((btn,i)=>{
    btn.classList.toggle("active", i===STATE.phase);
  });
  document.getElementById("sisaTabs").style.display = STATE.phase===4?"flex":"none";
}
function updateSisaTabs(){
  document.querySelectorAll("#sisaTabs .subtab").forEach((btn,i)=>{
    btn.classList.toggle("active", i===STATE.sisaSub);
  });
}

// ═══════════════════════════════════════════════════════════
//  CONTROLS INIT
// ═══════════════════════════════════════════════════════════
function initControls(){
  document.getElementById("btnPlay").onclick=()=>{
    if(STATE.playing) stopPlay(); else startPlay();
    render();
  };
  document.getElementById("btnReset").onclick=()=>{ stopPlay(); STATE.step=0; render(); };
  document.getElementById("btnPrev").onclick=()=>{ stopPlay(); STATE.step=Math.max(0,STATE.step-1); render(); };
  document.getElementById("btnNext").onclick=()=>{ const h=getHistory(); if(h){stopPlay(); STATE.step=Math.min(h.length-1,STATE.step+1); render();} };
  document.getElementById("stepSlider").oninput=e=>{ stopPlay(); STATE.step=+e.target.value; render(); };
  document.getElementById("speedSlider").oninput=e=>{ STATE.speed=+e.target.value; };
}

// ═══════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════
buildTabs();
initControls();
render();
</script>
